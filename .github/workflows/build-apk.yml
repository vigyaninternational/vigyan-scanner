name: Build APK

# Every push to main: run the tests, build the APK, and publish it as a GitHub Release.
# The newest APK is always at:
#   https://github.com/<owner>/<repo>/releases/latest/download/VigyanScanner.apk
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # run_number goes up by 1 every build, so each APK installs straight over the last one.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Unit tests (Smart Fill)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace || (echo "Retrying after transient failure..." && sleep 20 && ./gradlew assembleDebug --stacktrace)

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VigyanScanner.apk
          echo "APK size: $(stat -c %s VigyanScanner.apk) bytes"

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Vigyan Scanner ${{ env.VERSION_NAME }}
          body: "Install: open this page in Chrome on the phone and tap VigyanScanner.apk."
          files: VigyanScanner.apk
          make_latest: true

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 7
